appId: games.brickbox.desktop
productName: Brickbox
copyright: Copyright © 2026 Brickbox contributors
asar: true
directories:
  output: release
  buildResources: public
files:
  - dist/**/*
  - desktop/*.cjs
  - package.json
icon: public/icon.png
artifactName: Brickbox-${version}-${os}-${arch}.${ext}
win:
  target:
    - nsis
    - zip
  icon: public/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.arcade-games
  icon: public/icon.png
linux:
  syncDesktopName: true
  target:
    - AppImage
  category: Game
  icon: public/icon.png
